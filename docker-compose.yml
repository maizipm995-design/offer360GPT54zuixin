# 根目录编排用于本地基础启动与快速验证，生产发布以 deploy/prod 为准。
version: '3.9'
services:
  mysql:
    image: mysql:8.0
    container_name: offer360-mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-offer360}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: offer360-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: offer360-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - '9200:9200'
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:9200 >/dev/null 2>&1']
      interval: 15s
      timeout: 5s
      retries: 20

  wechat-pay-gateway:
    build:
      context: ./apps/wechat-pay-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WECHAT_PAY_GATEWAY_PORT: 8080
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_APP_ID: ${WECHAT_PAY_APP_ID:-}
      WECHAT_PAY_APP_SECRET: ${WECHAT_PAY_APP_SECRET:-}
      WECHAT_PAY_MCH_CERT_SERIAL_NO: ${WECHAT_PAY_MCH_CERT_SERIAL_NO:-}
      WECHAT_PAY_PUBLIC_KEY_ID: ${WECHAT_PAY_PUBLIC_KEY_ID:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_PRIVATE_KEY_PATH: ${WECHAT_PAY_PRIVATE_KEY_PATH:-/app/.config/certs/apiclient_key.pem}
      WECHAT_PAY_MCH_CERT_PATH: ${WECHAT_PAY_MCH_CERT_PATH:-/app/.config/certs/apiclient_cert.pem}
      WECHAT_PAY_PUBLIC_KEY_PATH: ${WECHAT_PAY_PUBLIC_KEY_PATH:-/app/.config/certs/wechat_pay_public_key.pem}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
      WECHAT_PAY_REFUND_NOTIFY_URL: ${WECHAT_PAY_REFUND_NOTIFY_URL:-}
      WECHAT_PAY_CALLBACK_BASE_URL: ${WECHAT_PAY_CALLBACK_BASE_URL:-}
    volumes:
      # Host certs can live in different directories, but the container path stays fixed.
      - ${WECHAT_PAY_CERTS_HOST_PATH:-./.config/certs}:/app/.config/certs:ro
    ports:
      - '${WECHAT_PAY_GATEWAY_HOST_PORT:-15000}:8080'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: offer360-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      wechat-pay-gateway:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      API_PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      AUTH_CODE_TTL_MINUTES: ${AUTH_CODE_TTL_MINUTES:-5}
      AUTH_CODE_LENGTH: ${AUTH_CODE_LENGTH:-6}
      AUTH_CODE_SECRET: ${AUTH_CODE_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      OSS_REGION: ${OSS_REGION:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_STS_ROLE_ARN: ${OSS_STS_ROLE_ARN:-}
      OSS_STS_ENDPOINT: ${OSS_STS_ENDPOINT:-sts.aliyuncs.com}
      OSS_UPLOAD_EXPIRE_SECONDS: ${OSS_UPLOAD_EXPIRE_SECONDS:-900}
      OSS_SIGN_EXPIRE_SECONDS: ${OSS_SIGN_EXPIRE_SECONDS:-1800}
      OSS_CUSTOM_DOMAIN: ${OSS_CUSTOM_DOMAIN:-}
      WECHAT_PAY_GATEWAY_URL: http://wechat-pay-gateway:8080
      WECHAT_PAY_APP_ID: ${WECHAT_PAY_APP_ID:-}
      WECHAT_PAY_APP_SECRET: ${WECHAT_PAY_APP_SECRET:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
      WECHAT_PAY_REFUND_NOTIFY_URL: ${WECHAT_PAY_REFUND_NOTIFY_URL:-}
      WECHAT_PAY_CALLBACK_BASE_URL: ${WECHAT_PAY_CALLBACK_BASE_URL:-}
      WECHAT_PAY_ORDER_EXPIRE_MINUTES: ${WECHAT_PAY_ORDER_EXPIRE_MINUTES:-15}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      INTERVIEW_TRANSCRIPT_WORKFLOW_RUN_URL: ${INTERVIEW_TRANSCRIPT_WORKFLOW_RUN_URL:-https://5f7454nvm6.coze.site/stream_run}
      INTERVIEW_TRANSCRIPT_WORKFLOW_TOKEN: ${INTERVIEW_TRANSCRIPT_WORKFLOW_TOKEN:-}
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:4000/healthz >/dev/null 2>&1']
      interval: 15s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: offer360-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      WEB_APP_BASE_URL: ${WEB_APP_BASE_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api}
      INTERNAL_API_BASE_URL: http://api:4000/api
      NEXT_SERVER_ACTIONS_ALLOWED_ORIGINS: ${NEXT_SERVER_ACTIONS_ALLOWED_ORIGINS:-localhost:3000,127.0.0.1:3000}
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:3000/healthz >/dev/null 2>&1']
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  redis_data:
  es_data:
