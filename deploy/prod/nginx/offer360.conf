server {
    listen 80;
    listen [::]:80;
    server_name offer360.cn;
    return 301 https://www.offer360.cn$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.offer360.cn;
    return 301 https://www.offer360.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name offer360.cn;

    client_max_body_size 50m;
    ssl_certificate /etc/nginx/ssl/www.offer360.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/www.offer360.cn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://www.offer360.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.offer360.cn;

    client_max_body_size 50m;
    ssl_certificate /etc/nginx/ssl/www.offer360.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/www.offer360.cn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
