map $http_user_agent $offer360_block_bad_ua {
    default 0;
    ~*(python-requests|curl|wget|scrapy|spider|crawler|httpclient|go-http-client|aiohttp|apachebench|headlesschrome|selenium|playwright) 1;
}

geo $offer360_blocked_ip {
    default 0;
    # 手工 IP 黑名单入口，按需追加：
    # 1.2.3.4/32 1;
}

map "$offer360_block_bad_ua$offer360_blocked_ip" $offer360_block_request {
    default 0;
    ~*1 1;
}

limit_req_zone $binary_remote_addr zone=offer360_general_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=offer360_jobs_list_per_ip:10m rate=4r/s;
limit_req_zone $binary_remote_addr zone=offer360_jobs_sensitive_per_ip:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name offer360.cn;
    return 301 https://www.offer360.cn$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.offer360.cn;
    return 301 https://www.offer360.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name offer360.cn;

    client_max_body_size 50m;
    ssl_certificate /www/server/panel/vhost/cert/www.offer360.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/www.offer360.cn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://www.offer360.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.offer360.cn;

    client_max_body_size 50m;
    ssl_certificate /www/server/panel/vhost/cert/www.offer360.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/www.offer360.cn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    if ($offer360_block_request) {
        return 403;
    }

    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /api/proxy/jobs {
        limit_req zone=offer360_jobs_list_per_ip burst=8 nodelay;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /api/proxy/jobs/suggestions {
        limit_req zone=offer360_jobs_list_per_ip burst=4 nodelay;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ ^/api/proxy/jobs/[^/]+/(view-announcement|announcement-redirect|deliver|delivery-redirect)$ {
        limit_req zone=offer360_jobs_sensitive_per_ip burst=3 nodelay;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        limit_req zone=offer360_general_per_ip burst=40 nodelay;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
