name: ${STACK_NAME:-offer360-prod}

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
  REDIS_URL: redis://redis:6379
  ELASTICSEARCH_NODE: http://elasticsearch:9200
  API_PORT: 4000
  CORS_ORIGIN: ${CORS_ORIGIN}
  JWT_SECRET: ${JWT_SECRET}
  WEB_APP_BASE_URL: ${WEB_APP_BASE_URL}
  AUTH_CODE_TTL_MINUTES: ${AUTH_CODE_TTL_MINUTES:-5}
  AUTH_CODE_LENGTH: ${AUTH_CODE_LENGTH:-6}
  AUTH_CODE_SECRET: ${AUTH_CODE_SECRET}
  ALIYUN_SMS_ENDPOINT: ${ALIYUN_SMS_ENDPOINT:-dysmsapi.aliyuncs.com}
  ALIYUN_SMS_ACCESS_KEY_ID: ${ALIYUN_SMS_ACCESS_KEY_ID:-}
  ALIYUN_SMS_ACCESS_KEY_SECRET: ${ALIYUN_SMS_ACCESS_KEY_SECRET:-}
  ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
  ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
  ALIYUN_SMS_TEMPLATE_PARAM_NAME: ${ALIYUN_SMS_TEMPLATE_PARAM_NAME:-code}
  OSS_REGION: ${OSS_REGION:-}
  OSS_ENDPOINT: ${OSS_ENDPOINT:-}
  OSS_BUCKET: ${OSS_BUCKET:-}
  OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
  OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
  OSS_STS_ROLE_ARN: ${OSS_STS_ROLE_ARN:-}
  OSS_STS_ENDPOINT: ${OSS_STS_ENDPOINT:-sts.aliyuncs.com}
  OSS_UPLOAD_EXPIRE_SECONDS: ${OSS_UPLOAD_EXPIRE_SECONDS:-900}
  OSS_SIGN_EXPIRE_SECONDS: ${OSS_SIGN_EXPIRE_SECONDS:-1800}
  OSS_CUSTOM_DOMAIN: ${OSS_CUSTOM_DOMAIN:-}
  WECHAT_PAY_APP_ID: ${WECHAT_PAY_APP_ID:-}
  WECHAT_PAY_APP_SECRET: ${WECHAT_PAY_APP_SECRET:-}
  WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
  WECHAT_PAY_REFUND_NOTIFY_URL: ${WECHAT_PAY_REFUND_NOTIFY_URL:-}
  WECHAT_PAY_ORDER_EXPIRE_MINUTES: ${WECHAT_PAY_ORDER_EXPIRE_MINUTES:-15}
  PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser

x-web-env: &web-env
  NODE_ENV: production
  NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
  NEXT_SERVER_ACTIONS_ALLOWED_ORIGINS: ${NEXT_SERVER_ACTIONS_ALLOWED_ORIGINS:-localhost}
  PORT: 3000
  HOSTNAME: 0.0.0.0

x-wechat-env: &wechat-env
  WECHAT_PAY_GATEWAY_PORT: 8080
  WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
  WECHAT_PAY_APP_ID: ${WECHAT_PAY_APP_ID:-}
  WECHAT_PAY_APP_SECRET: ${WECHAT_PAY_APP_SECRET:-}
  WECHAT_PAY_MCH_CERT_SERIAL_NO: ${WECHAT_PAY_MCH_CERT_SERIAL_NO:-}
  WECHAT_PAY_PUBLIC_KEY_ID: ${WECHAT_PAY_PUBLIC_KEY_ID:-}
  WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
  WECHAT_PAY_PRIVATE_KEY_PATH: ${WECHAT_PAY_PRIVATE_KEY_PATH:-/app/.config/certs/apiclient_key.pem}
  WECHAT_PAY_MCH_CERT_PATH: ${WECHAT_PAY_MCH_CERT_PATH:-/app/.config/certs/apiclient_cert.pem}
  WECHAT_PAY_PUBLIC_KEY_PATH: ${WECHAT_PAY_PUBLIC_KEY_PATH:-/app/.config/certs/wechat_pay_public_key.pem}
  WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
  WECHAT_PAY_REFUND_NOTIFY_URL: ${WECHAT_PAY_REFUND_NOTIFY_URL:-}
  WECHAT_PAY_CALLBACK_BASE_URL: ${WECHAT_PAY_CALLBACK_BASE_URL:-}

services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT_HOST:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT_HOST:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT_HOST:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9200 >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 20

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-_}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-50m}
    volumes:
      - ./nginx/offer360.conf:/etc/nginx/templates/default.conf.template:ro
      - ./runtime/nginx:/etc/nginx/conf.d/upstreams:rw
    ports:
      - "${GATEWAY_HTTP_PORT:-18080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/__gateway_health >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 20

  migrator:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/offer360-api:${MIGRATION_IMAGE_TAG:-bootstrap}
    working_dir: /app
    profiles: ["ops"]
    environment:
      <<: *api-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    command: ["npm", "run", "prisma:migrate:deploy", "--workspace", "@offer360/api"]
    restart: "no"

  wechat-pay-gateway-blue:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/offer360-wechat-pay-gateway:${BLUE_IMAGE_TAG:-bootstrap}
    restart: unless-stopped
    environment:
      <<: *wechat-env
    volumes:
      - ${WECHAT_PAY_CERTS_HOST_PATH:-/opt/offer360/certs}:/app/.config/certs:ro
    ports:
      - "127.0.0.1:${BLUE_WECHAT_PAY_GATEWAY_HOST_PORT:-15001}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/ >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 20

  api-blue:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/offer360-api:${BLUE_IMAGE_TAG:-bootstrap}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      wechat-pay-gateway-blue:
        condition: service_healthy
    environment:
      <<: *api-env
      WECHAT_PAY_GATEWAY_URL: http://wechat-pay-gateway-blue:8080
    ports:
      - "127.0.0.1:${BLUE_API_HOST_PORT:-4001}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:4000/healthz >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 20

  web-blue:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/offer360-web:${BLUE_IMAGE_TAG:-bootstrap}
    restart: unless-stopped
    depends_on:
      api-blue:
        condition: service_healthy
    environment:
      <<: *web-env
      INTERNAL_API_BASE_URL: http://api-blue:4000/api
    ports:
      - "127.0.0.1:${BLUE_WEB_HOST_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/healthz >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 20

  wechat-pay-gateway-green:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/offer360-wechat-pay-gateway:${GREEN_IMAGE_TAG:-bootstrap}
    restart: unless-stopped
    environment:
      <<: *wechat-env
    volumes:
      - ${WECHAT_PAY_CERTS_HOST_PATH:-/opt/offer360/certs}:/app/.config/certs:ro
    ports:
      - "127.0.0.1:${GREEN_WECHAT_PAY_GATEWAY_HOST_PORT:-15002}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/ >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 20

  api-green:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/offer360-api:${GREEN_IMAGE_TAG:-bootstrap}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      wechat-pay-gateway-green:
        condition: service_healthy
    environment:
      <<: *api-env
      WECHAT_PAY_GATEWAY_URL: http://wechat-pay-gateway-green:8080
    ports:
      - "127.0.0.1:${GREEN_API_HOST_PORT:-4002}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:4000/healthz >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 20

  web-green:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/offer360-web:${GREEN_IMAGE_TAG:-bootstrap}
    restart: unless-stopped
    depends_on:
      api-green:
        condition: service_healthy
    environment:
      <<: *web-env
      INTERNAL_API_BASE_URL: http://api-green:4000/api
    ports:
      - "127.0.0.1:${GREEN_WEB_HOST_PORT:-3002}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/healthz >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  redis_data:
  es_data:
